# Example production-oriented Compose file (not wired to CI).
# Replace image: directives with your registry builds; use strong secrets and TLS at the edge.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Do not publish 5432 publicly; DB reachable only on internal networks.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Prefer Redis ACL + password in production.

  migrate:
    image: ${API_IMAGE:-dipwise-api:latest}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${API_IMAGE:-dipwise-api:latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Put nginx/traefik in front for TLS termination; do not expose raw HTTP on the internet.

  celery_worker:
    image: ${API_IMAGE:-dipwise-api:latest}
    command: celery -A app.workers.celery_app worker -l info
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  celery_beat:
    image: ${API_IMAGE:-dipwise-api:latest}
    command: celery -A app.workers.celery_app beat -l info
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-dipwise-web:latest}
    environment:
      VITE_API_BASE_URL: ${PUBLIC_API_URL:-https://api.example.com}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
