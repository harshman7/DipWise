services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dipwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dipwise_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dipwise}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dipwise}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dipwise:dipwise_secret@postgres:5432/dipwise}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-random-secret}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app worker -l info
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dipwise:dipwise_secret@postgres:5432/dipwise}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app beat -l info
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dipwise:dipwise_secret@postgres:5432/dipwise}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api

volumes:
  pgdata:
